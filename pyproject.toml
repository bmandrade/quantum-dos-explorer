[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-dos-explorer"
version = "0.1.0"
description = "Interactive and scriptable exploration of the density of states of a rectangular quantum box."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Quantum DOS Explorer contributors" },
]
keywords = [
    "density of states",
    "quantum confinement",
    "free-electron model",
    "condensed matter physics",
    "nanoscience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
quantum-dos = "quantum_dos.cli:main"
quantum-dos-gui = "quantum_dos.gui:main"

[project.urls]
Repository = "https://github.com/REPLACE_ME/quantum-dos-explorer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
